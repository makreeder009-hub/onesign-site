name: Fetch site images
on:
  push:
    paths: ["_wix/manifest.tsv", ".github/workflows/fetch-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          fail=0
          while IFS=$'\t' read -r url dest; do
            [ -z "$url" ] && continue
            mkdir -p "$(dirname "$dest")"
            if [ ! -s "$dest" ]; then
              curl -sSL --retry 3 --max-time 60 -o "$dest" "$url" || { echo "FAILED $url"; rm -f "$dest"; fail=$((fail+1)); }
            fi
          done < _wix/manifest.tsv
          echo "failures: $fail"
          ls img/wix | wc -l
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add site images fetched from the old Wix media library"
          git push
